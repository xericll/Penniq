<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EBE7E0" />
    <meta name="color-scheme" content="light dark" />
    <title>Penniq</title>
    <meta name="description" content="Penniq — كل قرش بحسابه. محفظة الكاش والبنك وتتبع المصاريف باليورو." />
    <meta property="og:title" content="Penniq" />
    <meta property="og:description" content="كل قرش بحسابه — محفظة الكاش والبنك وتتبع المصاريف" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Pre-paint: apply saved edition, language and privacy before React mounts (no flash).
      (function () {
        try {
          var LEGACY = {
            olive: 'night', paper: 'linen', indigo: 'night', plum: 'night', sand: 'linen', graphite: 'night',
            'night-steel': 'night', 'purple-dusk': 'night', 'calm-green': 'sage',
            'beige-black-brown': 'linen', 'night-crimson': 'night', 'espresso': 'linen'
          };
          var BG = { linen: '#EBE7E0', mist: '#E6E7EA', sage: '#E1E6DC', blush: '#EFE4DF', night: '#101112' };
          var root = document.documentElement;
          var pref = localStorage.getItem('qirsh_app_theme') || 'auto';
          if (LEGACY[pref]) pref = LEGACY[pref];
          if (pref !== 'auto' && !BG[pref]) pref = 'auto';
          var resolved = pref;
          if (pref === 'auto') {
            var host = root.getAttribute('data-theme');
            var dark = host === 'dark' || (host !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            resolved = dark ? 'night' : 'linen';
          }
          root.dataset.edition = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', BG[resolved]);

          if (localStorage.getItem('qirsh_amounts_hidden') === 'true') root.classList.add('amounts-hidden');

          var lang = localStorage.getItem('qirsh_app_language');
          if (lang !== 'ar' && lang !== 'de' && lang !== 'en') {
            var nav = (navigator.language || '').toLowerCase();
            lang = nav.indexOf('de') === 0 ? 'de' : nav.indexOf('en') === 0 ? 'en' : 'ar';
          }
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..700&family=JetBrains+Mono:wght@400;500&family=Readex+Pro:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
